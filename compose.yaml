services:
  trainer:
    image: ajay/ms-swift:4.5.3-cu130
    build:
      context: .
    container_name: ms-swift-agent
    gpus: all
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    shm_size: "2gb"
    stdin_open: true
    tty: true
    environment:
      PYTHONPATH: /opt/agent-lab
      HOME: /workspace/.home
      HF_HOME: /workspace/.cache/huggingface
      MODELSCOPE_CACHE: /workspace/.cache/modelscope
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    volumes:
      - ${MODELS_DIR:-${HOME}/Models}:/models:ro
      - ${TRAIN_DIR:-${HOME}/Train/ms-swift}:/workspace
      - ./scripts:/opt/agent-scripts:ro
      - ./agent_lab:/opt/agent-lab/agent_lab:ro
    command: ["sleep", "infinity"]
